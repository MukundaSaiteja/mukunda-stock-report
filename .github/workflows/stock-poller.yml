name: Stock Poller

# Polls Telegram every 5 min for "/stock <SYMBOL>" commands and replies with a
# research PDF. Public repo -> unlimited Actions minutes, so 5-min polling is free.
on:
  schedule:
    - cron: "* * * * *"   # every minute (public repo = free unlimited minutes)
  workflow_dispatch:
    inputs:
      symbol:
        description: "Analyse this NSE symbol now (skip polling)"
        required: false
        type: string

concurrency:
  group: stock-poller
  cancel-in-progress: false

permissions:
  contents: write   # allow committing the alerts state back

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt

      - name: Manual analyse (workflow_dispatch with a symbol)
        if: ${{ github.event.inputs.symbol != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.STOCK_CHAT_ID }}
        run: python main.py --symbol "${{ github.event.inputs.symbol }}" --send

      - name: Poll for /stock commands + check price alerts
        if: ${{ github.event.inputs.symbol == '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          STOCK_ALLOWED_CHAT: ${{ secrets.STOCK_CHAT_ID }}
          ALERTS_FILE: data/alerts.json
        run: python poller.py

      - name: Persist alerts state (if changed)
        if: ${{ github.event.inputs.symbol == '' }}
        run: |
          if ! git diff --quiet -- data/alerts.json; then
            git config user.name  "stock-bot"
            git config user.email "stock-bot@users.noreply.github.com"
            git add data/alerts.json
            git commit -m "chore: update price-alert state [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "No alert-state change."
          fi
